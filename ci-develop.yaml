name: Linting Check
on:
  pull_request:
    branches: [develop]
jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install -g htmlhint stylelint
      - run: htmlhint "**/*.html"
      - run: stylelint "**/*.css"
